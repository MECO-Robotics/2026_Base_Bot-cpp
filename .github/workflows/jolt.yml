name: Jolt physics
on: [push, pull_request, workflow_dispatch]
jobs:
  portable-world:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: lukka/get-cmake@latest
      - run: cmake -S simulation -B build/jolt -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build/jolt --parallel 2
      - run: ctest --test-dir build/jolt --output-on-failure
