name: Jolt physics
on:
  push:
    paths-ignore: ['artifacts/**', '**/*.md']
  pull_request:
    paths-ignore: ['artifacts/**', '**/*.md']
  workflow_dispatch:
jobs:
  portable-world:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: lukka/get-cmake@latest
      - run: cmake -S simulation -B build/jolt -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build/jolt --parallel 2
      - run: ctest --test-dir build/jolt --output-on-failure
      - name: Benchmark release models
        if: matrix.config == 'Release'
        shell: bash
        run: |
          mkdir -p artifacts
          python scripts/sim_benchmark.py --build-dir build/jolt --output artifacts/benchmark.json --max-p99-ms 4
          git rev-parse HEAD > artifacts/revision.txt
          cmake --version > artifacts/toolchain.txt
          python -c "import platform,json; print(json.dumps(platform.uname()._asdict(),indent=2))" > artifacts/machine.json
      - name: Fetch pinned official Windows vendor artifacts
        if: runner.os == 'Linux' && matrix.config == 'Release'
        run: python scripts/prepare_vendor_cache.py --output build/vendor-cache
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.config == 'Release'
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-${{ matrix.os }}-${{ matrix.config }}
          path: |
            artifacts/
            build/jolt/Testing/Temporary/
  robot:
    needs: portable-world
    env:
      FRC_SIM_PHYSICS: jolt-planar
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: lukka/get-cmake@latest
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: studica-windows-maven-2026.0.0
          path: build/vendor-cache
      - name: Verify transferred official vendor cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/prepare_vendor_cache.py --output build/vendor-cache --verify-only
          python - <<'PYTHON'
          import os, pathlib
          cache = pathlib.Path('build/vendor-cache').resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FRC_VENDOR_CACHE={cache}\n')
          PYTHON
      - name: Install roboRIO toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew installRoboRioToolchain
      - name: Build and test Linux desktop debug/release
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew frcUserProgramLinuxx86-64DebugExecutable frcUserProgramLinuxx86-64ReleaseExecutable runFrcUserProgramTestLinuxx86-64DebugGoogleTestExe runFrcUserProgramTestLinuxx86-64ReleaseGoogleTestExe --max-workers=2
      - name: Build and test Windows desktop debug/release
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew frcUserProgramWindowsx86-64DebugExecutable frcUserProgramWindowsx86-64ReleaseExecutable runFrcUserProgramTestWindowsx86-64DebugGoogleTestExe runFrcUserProgramTestWindowsx86-64ReleaseGoogleTestExe -Ptoolchain-optional-roboRio --max-workers=2
      - name: Verify roboRIO isolation
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew assemble --max-workers=2
      - run: python -m pip install 'pyntcore>=2026,<2027' 'websockets>=14,<17'
      - name: Resolve pinned HAL websocket extension
        shell: bash
        run: ./gradlew prepareHeadlessSimulation -Ptoolchain-optional-roboRio
      - name: Exercise local HAL simulator
        shell: bash
        run: |
          python scripts/sim_headless.py --backend jolt-planar --smoke-output artifacts/smoke-planar.json
          python scripts/sim_headless.py --backend jolt-3d --smoke-output artifacts/smoke-3d.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-${{ matrix.os }}
          path: |
            artifacts/
            build/test-results/
            build/reports/
