plugins {
    id "c"
    id "cpp"
    id "google-test-test-suite"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcCpp(getArtifactTypeClass('FRCNativeArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = true
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcCpp

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Set to true to run simulation in debug mode
wpi.cpp.debugSimulation = false

// Default enable simgui
wpi.sim.addGui().defaultEnabled = true
// Enable DS but not by default
wpi.sim.addDriverstation()
// Resolve the optional local HAL transport without opening it in ordinary GUI runs.
wpi.sim.addWebsocketsServer().defaultEnabled = false
tasks.register('prepareHeadlessSimulation') {
    doLast { wpi.sim.releaseConfiguration.resolve() }
}

// Set the platform default so GradleRIO cannot append C++20 after our flag.
// The pinned roboRIO GCC 12 supports only a subset of C++23.
nativeUtils.platformConfigs.all {
    cppCompiler.args.removeAll { it.startsWith('-std=') || it.startsWith('/std:') }
    cppCompiler.args.add(name.startsWith('windows') ? '/std:c++latest' : '-std=c++23')
}

model {
    components {
        frcUserProgram(NativeExecutableSpec) {
            targetPlatform wpi.platforms.roborio
            if (includeDesktopSupport) {
                targetPlatform wpi.platforms.desktop
            }

            sources.cpp {
                source {
                    srcDir 'src/main/cpp'
                    include '**/*.cpp', '**/*.cc'
                }
                exportedHeaders {
                    srcDir 'src/main/include'
                }
            }

            sources.c {
                source {
                    srcDir 'src/main/c'
                    include '**/*.c'
                }
                exportedHeaders {
                    srcDir 'src/main/include'
                }
            }

            // Set deploy task to deploy this component
            deployArtifact.component = it

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            // Enable simulation for this component
            wpi.sim.enable(it)
            // Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
        }
    }
    testSuites {
        frcUserProgramTest(GoogleTestTestSuiteSpec) {
            testing $.components.frcUserProgram

            sources.cpp {
                source {
                    srcDir 'src/test/cpp'
                    include '**/*.cpp'
                }
            }

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
            wpi.cpp.deps.googleTest(it)
        }
    }
}

// Jolt is desktop-only: GradleRIO continues to own all roboRIO compilation.
def joltCmake = providers.environmentVariable('CMAKE_COMMAND').getOrElse('cmake')
['Debug', 'Release'].each { configuration ->
    tasks.register("buildJolt${configuration}", Exec) {
        def output = layout.buildDirectory.dir("jolt/${configuration}").get().asFile
        inputs.files(fileTree('simulation'))
        outputs.files(new File(output, "lib/${System.getProperty('os.name').toLowerCase().contains('windows') ? 'frc_jolt.lib' : 'libfrc_jolt.a'}"))
        outputs.files(new File(output, "lib/${System.getProperty('os.name').toLowerCase().contains('windows') ? 'Jolt.lib' : 'libJolt.a'}"))
        commandLine joltCmake, '--build', output, '--config', configuration, '--parallel', '2'
        doFirst {
            project.exec {
                commandLine joltCmake, '-S', file('simulation'), '-B', output,
                    '-DCMAKE_BUILD_TYPE=' + configuration, '-DBUILD_TESTING=OFF'
            }
        }
    }
}
model {
    binaries {
        all { binary ->
            if (binary.targetPlatform.name != wpi.platforms.roborio) {
                binary.cppCompiler.args binary.targetPlatform.name.startsWith('windows') ? '/I' + file('simulation/include') : '-I' + file('simulation/include')
                def configuration = binary.buildType.name.equalsIgnoreCase('debug') ? 'Debug' : 'Release'
                def directory = file("build/jolt/${configuration}/lib")
                if (binary.targetPlatform.name.startsWith('windows')) {
                    binary.linker.args new File(directory, 'frc_jolt.lib').path, new File(directory, 'Jolt.lib').path
                } else {
                    binary.linker.args '-Wl,--whole-archive', new File(directory, 'libfrc_jolt.a').path,
                        new File(directory, 'libJolt.a').path, '-Wl,--no-whole-archive', '-pthread'
                }

            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("link") && !task.name.toLowerCase().contains("linuxathena")) {
        task.dependsOn task.name.toLowerCase().contains("debug") ? "buildJoltDebug" : "buildJoltRelease"
    }
}
